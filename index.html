<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta
      name="description"
      content="Finora - an intelligent personal finance assistant with ML expense categorisation, forecasting, budgets and insights."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Finora · Intelligent Personal Finance</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('finora-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch {
          /* no-op */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
